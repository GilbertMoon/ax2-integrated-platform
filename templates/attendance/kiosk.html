<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>출석 체크 키오스크</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; text-align: center; }
  video, canvas { width: 100%; border-radius: 12px; background: #000; }
  button { padding: 18px 36px; font-size: 20px; margin-top: 20px; border-radius: 10px;
           border: none; background: #2563eb; color: white; cursor: pointer; }
  button:disabled { background: #94a3b8; }
  #result { margin-top: 20px; padding: 20px; border-radius: 8px; font-size: 22px; display: none; min-height: 30px; }
  .success { background: #d4edda; color: #155724; }
  .fail { background: #f8d7da; color: #721c24; }
  .loading { background: #fff3cd; color: #856404; }
</style>
</head>
<body>
{% csrf_token %}

<h1>📷 출석 체크</h1>
<p>카메라를 보고 아래 버튼을 눌러주세요.</p>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<button id="captureBtn">출석 체크하기</button>

<div id="result"></div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const resultDiv = document.getElementById('result');
const captureBtn = document.getElementById('captureBtn');

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => { video.srcObject = stream; })
  .catch(err => {
    resultDiv.style.display = 'block';
    resultDiv.className = 'fail';
    resultDiv.textContent = '카메라를 켤 수 없습니다. 브라우저 권한을 확인해주세요.';
  });

captureBtn.addEventListener('click', async () => {
  captureBtn.disabled = true;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  canvas.toBlob(async (blob) => {
    resultDiv.style.display = 'block';
    resultDiv.className = 'loading';
    resultDiv.textContent = '확인 중입니다... (몇 초 걸릴 수 있어요)';

    const formData = new FormData();
    formData.append('image', blob, 'checkin.jpg');

    try {
      const response = await fetch("{% url 'attendance:face-checkin' %}", {
        method: 'POST',
        body: formData,
        headers: { 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value },
      });
      const data = await response.json();

      if (data.matched) {
        resultDiv.className = 'success';
        resultDiv.textContent = `✅ ${data.display_name}님, 출석 처리되었습니다!`;
      } else {
        resultDiv.className = 'fail';
        resultDiv.textContent = `❌ ${data.message || '인식 실패'}`;
      }
    } catch (error) {
      resultDiv.className = 'fail';
      resultDiv.textContent = '서버 오류: ' + error;
    } finally {
      setTimeout(() => {
        captureBtn.disabled = false;
        resultDiv.style.display = 'none';
      }, 3000);
    }
  }, 'image/jpeg');
});

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
      cookie = cookie.trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>

</body>
</html>
