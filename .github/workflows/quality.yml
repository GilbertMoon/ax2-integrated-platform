name: Quality checks

on:
  push:
    branches: [main, tmp/djlint-format]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ax_evaluation
          POSTGRES_USER: ax_evaluation
          POSTGRES_PASSWORD: ax_evaluation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ax_evaluation -d ax_evaluation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: ax_evaluation
      POSTGRES_USER: ax_evaluation
      POSTGRES_PASSWORD: ax_evaluation
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Reformat Django templates for inspection
        run: djlint . --reformat || true

      - name: Commit formatted templates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates
          if git diff --cached --quiet; then
            echo "Templates already formatted"
          else
            git commit -m "style: format Django templates"
            git push
          fi

      - name: Upload formatted templates
        uses: actions/upload-artifact@v4
        with:
          name: djlint-formatted-templates
          path: templates

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Check Django template formatting
        run: djlint . --check

      - name: Lint Django templates
        run: djlint .

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      - name: Validate production Compose configuration
        env:
          PRODUCTION_ENV_FILE: .env.production.example
        run: >-
          docker compose --env-file .env.production.example
          -f compose.production.yaml config --quiet

      - name: Build production images
        env:
          PRODUCTION_ENV_FILE: .env.production.example
        run: >-
          docker compose --env-file .env.production.example
          -f compose.production.yaml build app caddy
