services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ax_evaluation}
      POSTGRES_USER: ${POSTGRES_USER:-ax_evaluation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5433:5432"

  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_FACE_SERVICE_URL: http://face-service:5001
    depends_on:
      face-service:
        condition: service_started
    volumes:
      - media_data:/app/media  

  face-service:
    build: ./face-recognition-service
    restart: unless-stopped
    ports:
      - "5001:5001"

volumes:
  postgres_data:
  media_data: