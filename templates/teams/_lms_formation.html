{% if role == 'tutor' and not preview_mode %}
  <section id="teamLmsPanel"
           class="card-custom p-3 mb-3"
           data-catalog="{% url 'teams:lms-catalog' team_data.round_id %}">
    <h2 class="h5">팀 편성 기준 점수</h2>
    <p class="small text-muted">기존 평가에서 LMS 기여분을 제외한 기준 점수와 선택 과제 점수를 합산합니다. 평가 결과 자체는 바뀌지 않습니다.</p>
    <label>
      <input type="checkbox" id="teamLmsEnabled">
      LMS 과제 점수 포함
    </label>
    <div id="teamLmsOptions" hidden>
      <label for="teamLmsWeight">
        LMS 반영 비율 <output id="teamLmsWeightLabel">30%</output>
      </label>
      <input class="form-range"
             type="range"
             id="teamLmsWeight"
             min="1"
             max="100"
             step="1"
             value="30">
      <p class="small" id="teamLmsBaseLabel">기존 평가 기준 점수 70% / LMS 30%</p>
      <div class="d-flex gap-2 flex-wrap mb-2">
        <select id="teamLmsRound" class="form-select" aria-label="LMS 과제 조회 회차">
          <option value="">전체 과제 (팀 과제는 회차 선택 필요)</option>
        </select>
        <input id="teamLmsQuery"
               class="form-control"
               placeholder="과제명 검색"
               aria-label="과제명 검색">
        <button type="button" id="teamLmsSearch" class="btn btn-outline-primary">검색</button>
        <button type="button" id="teamLmsAll" class="btn btn-outline-primary">검색 결과 전체 선택</button>
        <button type="button" id="teamLmsClear" class="btn btn-outline-secondary">선택 비우기</button>
      </div>
      <p class="small">회차 목록은 마감 스냅샷과 과제 마감 기간으로 조회합니다. 팀 과제는 선택 회차의 팀 소속을 사용합니다. 미채점 제출물은 평가 후 포함할 수 있습니다.</p>
      <div id="teamLmsList"></div>
      <div class="d-flex gap-2 mt-2">
        <button type="button"
                id="teamLmsPrev"
                class="btn btn-sm btn-outline-secondary">이전</button>
        <span id="teamLmsPage"></span>
        <button type="button"
                id="teamLmsNext"
                class="btn btn-sm btn-outline-secondary">다음</button>
      </div>
      <p id="teamLmsCount" class="mt-2">선택 0개</p>
    </div>
    <button type="button" id="teamLmsCalculate" class="btn btn-outline-primary">점수 계산 (팀 배치 유지)</button>
    <p id="teamLmsMessage" role="status" class="small"></p>
    <details>
      <summary>팀 편성 점수 계산 근거</summary>
      <pre id="teamLmsEvidence"
           class="small"
           style="white-space:pre-wrap;
                  max-height:20rem;
                  overflow:auto">점수 계산 또는 자동 배치 후 표시됩니다.</pre>
    </details>
  </section>
{% endif %}
