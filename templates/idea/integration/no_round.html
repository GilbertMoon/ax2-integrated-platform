{% extends "idea/integrated_base.html" %}
{% load static %}
{% block title %}회차 없음 | Idea Developer{% endblock %}
{% block content %}
  <section class="idea-dev idea-integration-state"
           aria-labelledby="idea-integration-title">
    <div class="idea-integration-card">
      <header class="idea-integration-head">
        <img class="idea-brand-mark"
             src="{% static 'idea/assets/brand/id-mark-primary.svg' %}"
             alt=""
             aria-hidden="true">
        <div>
          <span>IDEA DEVELOPER</span>
          <h1 id="idea-integration-title">참여 가능한 회차가 없습니다.</h1>
        </div>
      </header>
      <div class="idea-integration-body">
        <p>진행 중인 회차가 연결되면 별도 설정 없이 다시 시작할 수 있습니다.</p>
        <div class="idea-integration-status" role="status">
          <i><span class="idea-icon idea-icon-calendar3"></span></i>
          <div>
            <strong>현재 진행 중 회차 없음</strong><span>회차가 열리기 전까지는 Idea Developer의 변경 작업을 시작하지 않습니다.</span>
          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
