{% extends "idea/integrated_base.html" %}
{% load static %}
{% block title %}연동 일시 중단 | Idea Developer{% endblock %}
{% block content %}
  <section class="idea-dev idea-integration-state"
           aria-labelledby="idea-integration-title">
    <div class="idea-integration-card">
      <header class="idea-integration-head">
        <img class="idea-brand-mark"
             src="{% static 'idea/assets/brand/id-mark-primary.svg' %}"
             alt=""
             aria-hidden="true">
        <div>
          <span>IDEA DEVELOPER</span>
          <h1 id="idea-integration-title">회차 정보를 확인하고 있습니다.</h1>
        </div>
      </header>
      <div class="idea-integration-body">
        <p>사용자·회차 연동을 확인하지 못해 변경 작업을 잠시 제한했습니다.</p>
        <div class="idea-integration-status is-warning" role="alert">
          <i><span class="idea-icon idea-icon-cloud-slash"></span></i>
          <div>
            <strong>연동 정보를 불러오지 못했습니다.</strong><span>잠시 후 다시 시도해 주세요. 확인 전에는 변경 작업을 수행하지 않습니다.</span>
          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
