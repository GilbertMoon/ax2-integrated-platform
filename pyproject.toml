[tool.ruff]
line-length = 100
indent-width = 4
extend-exclude = ["docs", "2team_lms"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B",
  "DJ",
]

[tool.ruff.lint.per-file-ignores]
# Imported legacy models predate the repository-wide Ruff rules. Database VIEW
# fields must preserve their nullable schema, and model method reordering is
# intentionally deferred to avoid behavior changes in this integration PR.
"apps/accounts/models.py" = ["DJ008"]
"apps/ai/models.py" = ["DJ008"]
"apps/brainstorm/models.py" = ["DJ001", "DJ008", "DJ012"]
"apps/integration/models.py" = ["DJ001", "DJ008"]
"apps/prds/models.py" = ["DJ008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.djlint]
exclude = "2team_lms"
profile = "django"
indent = 2
use_gitignore = true
ignore = "T003,H006,H021,H031"

# 이메일 클라이언트 호환성에는 인라인 스타일이 필요하고 웹 페이지용 SEO 규칙은 적용되지 않는다.
[tool.djlint.per-file-ignores]
"templates/emails/custom_announcement.html" = "H021,H023,H030"
"templates/emails/results_released.html" = "H021,H023,H030"
"templates/emails/round_started.html" = "H021,H023,H030"
"templates/emails/submission_reminder.html" = "H021,H023,H030"
"templates/emails/verification_code.html" = "H021,H023,H030"
